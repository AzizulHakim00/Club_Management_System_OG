name: Build validated JavaFX project

on:
  push:
    branches:
      - import/validated-club-management-system-20260722
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: import/validated-club-management-system-20260722

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate required project files
        shell: bash
        run: |
          test -f pom.xml
          test -f database/real.sql
          test -f src/main/java/com/example/realmadrid/App.java
          test -f src/main/java/module-info.java

      - name: Validate FXML files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('src/main/resources').rglob('*.fxml'))
          if not files:
              raise SystemExit('No FXML files found')
          for path in files:
              ET.parse(path)
          print(f'Validated {len(files)} FXML files')
          PY

      - name: Build with Maven
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests clean package 2>&1 | tee /tmp/maven-build.log

      - name: Upload Maven failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: /tmp/maven-build.log
          if-no-files-found: error
          retention-days: 1
