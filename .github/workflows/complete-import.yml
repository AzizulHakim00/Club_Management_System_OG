name: Build validated JavaFX project

on:
  push:
    branches:
      - import/validated-club-management-system-20260722
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate required project files
        shell: bash
        run: |
          test -f pom.xml
          test -f database/real.sql
          test -f src/main/java/com/example/realmadrid/App.java
          test -f src/main/java/module-info.java

      - name: Validate FXML files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('src/main/resources').rglob('*.fxml'))
          if not files:
              raise SystemExit('No FXML files found')
          for path in files:
              ET.parse(path)
          print(f'Validated {len(files)} FXML files')
          PY

      - name: Build with Maven
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress -DskipTests clean package > /tmp/maven-build.log 2>&1
          status=$?
          tail -n 100 /tmp/maven-build.log
          exit $status
