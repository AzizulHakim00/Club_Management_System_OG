name: Import validated project

on:
  push:
    branches:
      - import/validated-club-management-system-20260722
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: import/validated-club-management-system-20260722
          fetch-depth: 0

      - name: Reconstruct cleaned project
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/clean-project.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/clean-project.tar.xz -C .

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import validated Club Management System project"
          git push origin HEAD:import/validated-club-management-system-20260722
